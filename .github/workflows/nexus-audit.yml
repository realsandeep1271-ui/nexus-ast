name: Nexus-AST Security Audit

on:
  pull_request:
    branches: [ main, master, dev ]
  push:
    branches: [ main, master ]

jobs:
  authorization-audit:
    name: Authorization & BOLA Policy Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Nexus-AST Engine
        run: |
          go build -o nexus-ast main.go

      - name: Execute AST Authorization Scan
        id: scan
        run: |
          ./nexus-ast scan --repo . --output report.json

      - name: Post PR Audit Comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('report.json')) {
              const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
              let body = `### 🚨 Nexus-AST Policy Audit Failed!\n\n`;
              body += `**Target Scanned:** \`${report.target}\`\n`;
              body += `**Policy Violations Identified:** ${report.findings.length}\n\n`;
              body += `| Severity | Finding | Endpoint / Source | Remediation |\n`;
              body += `|:---|:---|:---|:---|\n`;
              for (const f of report.findings) {
                body += `| **${f.severity}** | ${f.title} | \`${f.source_ref || f.endpoint}\` | ${f.remediation} |\n`;
              }
              body += `\n> *Please ensure session-bound tenant checks are included before merging this Pull Request.*`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
